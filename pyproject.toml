[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aqua-self-pruning-network"
version = "0.1.0"
description = "A NumPy-only self-pruning neural network with a custom autodiff engine."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools]
packages = ["engine", "nn", "prune", "train", "experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
